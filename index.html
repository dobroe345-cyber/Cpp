<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Mini-Rust</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:8px 14px;color:#fff;font:600 16px/1.3 -apple-system,system-ui,sans-serif;text-shadow:0 1px 3px #000;pointer-events:none}
#x{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font:300 26px sans-serif;text-shadow:0 0 3px #000;pointer-events:none}
button{position:fixed;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;color:#fff;font:700 13px/1 -apple-system,system-ui,sans-serif;background:rgba(18,26,18,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,.4);box-shadow:0 4px 14px rgba(0,0,0,.35);touch-action:none;-webkit-tap-highlight-color:transparent}
button b{font-size:30px;font-weight:400}
button.on{background:rgba(240,180,50,.85);border-color:#fff;color:#2a1c00}
#hit{right:calc(28px + env(safe-area-inset-right));bottom:calc(28px + env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%}
#jump{right:calc(160px + env(safe-area-inset-right));bottom:calc(36px + env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%}
#bar{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px}
#bar button{position:static;width:84px;height:76px;border-radius:16px}
#pad{position:fixed;left:calc(30px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;border:2px dashed rgba(255,255,255,.45);background:rgba(255,255,255,.07);color:rgba(255,255,255,.75);font:600 13px/150px -apple-system,system-ui,sans-serif;text-align:center;pointer-events:none}
@media(max-height:480px){#hit{width:84px;height:84px}#jump{width:60px;height:60px;right:calc(124px + env(safe-area-inset-right))}#pad{width:110px;height:110px;line-height:110px}#bar button{width:68px;height:60px}button b{font-size:24px}}
#touch{position:fixed;inset:0;z-index:2;touch-action:none}
#jb{position:fixed;display:none;z-index:2;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.55);pointer-events:none}
#jk{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#hud{padding:10px 14px}
#hud span{display:inline-block;margin-right:6px;padding:3px 9px;background:rgba(0,0,0,.45);border-radius:4px;font-size:15px}
#hud em{display:block;margin-top:8px;font-style:normal;font-size:17px}
#stats{position:fixed;z-index:3;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));width:210px;pointer-events:none}
.st{position:relative;display:flex;align-items:center;height:28px;margin-top:4px;background:rgba(10,14,18,.6);border:1px solid rgba(255,255,255,.15);overflow:hidden}
.st u{display:flex;align-items:center;justify-content:center;width:28px;height:100%;background:rgba(0,0,0,.4);font-size:15px;text-decoration:none;z-index:1}
.st i{position:absolute;left:28px;top:0;bottom:0;width:calc(100% - 28px);background:var(--c);opacity:.9;transform-origin:left}
.st b{position:relative;margin-left:auto;padding-right:9px;color:#fff;font:700 16px/1 -apple-system,system-ui,sans-serif;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#hp{--c:#7da83a}#th{--c:#3b8fd0}#hu{--c:#d98a2b}
#bar{gap:6px;bottom:calc(14px + env(safe-area-inset-bottom))}
#bar button{width:64px;height:64px;border-radius:4px;gap:0;font-size:10px;background:rgba(14,19,24,.62);border:2px solid rgba(255,255,255,.2);box-shadow:none}
#bar button b{font-size:26px}
#bar button em{position:absolute;left:5px;top:3px;font:700 11px/1 -apple-system,system-ui,sans-serif;font-style:normal;color:rgba(255,255,255,.75)}
#bar button.on{background:rgba(64,128,190,.7);border-color:#fff;color:#fff}
#bar button.no{opacity:.5;pointer-events:none}
#hit{right:calc(24px + env(safe-area-inset-right));bottom:calc(124px + env(safe-area-inset-bottom))}
#jump{right:calc(148px + env(safe-area-inset-right));bottom:calc(136px + env(safe-area-inset-bottom))}
@media(max-height:480px){#stats{width:165px}.st{height:22px}.st u{width:22px;font-size:12px}.st i{left:22px;width:calc(100% - 22px)}.st b{font-size:13px}#bar button{width:50px;height:50px}#bar button b{font-size:20px}#bar small{display:none}#hit{bottom:calc(96px + env(safe-area-inset-bottom))}#jump{bottom:calc(106px + env(safe-area-inset-bottom));right:calc(120px + env(safe-area-inset-right))}}
#hud span,.st,#bar button{background:rgba(150,160,165,.42)}
#hud span{border:1px solid rgba(255,255,255,.25)}
.st{height:38px;margin-top:5px;border:2px solid rgba(255,255,255,.32)}
.st u{width:38px;background:rgba(90,100,105,.55);font-size:20px}
.st i{left:38px;width:calc(100% - 38px);opacity:.95}
.st b{font-size:20px}
#stats{width:250px}
#bar button{border:2px solid rgba(255,255,255,.35)}
#bar button.on{background:rgba(64,128,190,.75)}
@media(max-height:480px){.st{height:30px}.st u{width:30px;font-size:16px}.st i{left:30px;width:calc(100% - 30px)}.st b{font-size:16px}#stats{width:200px}}
#stats{width:190px}
.st{height:30px;margin-top:5px;border:0}
.st u{width:30px;background:none;font-size:16px}
.st i{left:32px;top:4px;bottom:4px;width:calc(100% - 42px);opacity:1;border-radius:2px}
.st b{font-size:16px;padding-right:14px}
@media(max-height:480px){#stats{width:160px}.st{height:26px}.st u{width:26px;font-size:14px}.st i{left:28px;top:3px;bottom:3px;width:calc(100% - 36px)}.st b{font-size:14px;padding-right:12px}}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.32) 100%)}
#mapb{top:calc(12px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:54px;height:54px;border-radius:12px}
#map{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(4,10,16,.84)}
#map.on{display:flex}
#mc{width:min(86vh,86vw);height:min(86vh,86vw);border:2px solid rgba(255,255,255,.4);border-radius:8px;background:#0a2a44}
#mx{position:absolute;top:calc(14px + env(safe-area-inset-top));right:calc(18px + env(safe-area-inset-right));color:#fff;font:600 15px -apple-system,system-ui,sans-serif;padding:10px 14px;background:rgba(150,160,165,.35);border-radius:10px}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">Загрузка…</div>
<div id="x">+</div>
<button id="mapb"><b>🗺️</b></button>
<div id="map"><canvas id="mc" width="512" height="512"></canvas><div id="mx">✕ Закрыть</div></div>
<div id="vig"></div>
<button id="jump"><b>⤒</b>Прыжок</button>
<button id="hit"><b>🪓</b><span id="hl">Удар</span></button>
<div id="bar"><button data-s="0" class="on"><em>1</em><b>🪓</b><small>Топор</small></button><button data-s="1"><em>2</em><b>🟫</b><small>Пол · 30</small></button><button data-s="2"><em>3</em><b>🧱</b><small>Стена · 20</small></button><button class="no"><em>4</em></button><button class="no"><em>5</em></button><button class="no"><em>6</em></button></div>
<div id="touch"></div><div id="jb"><i id="jk"></i></div>
<div id="stats"><div class="st" id="hp"><u>✚</u><i></i><b>100</b></div><div class="st" id="th"><u>💧</u><i></i><b>100</b></div><div class="st" id="hu"><u>🍖</u><i></i><b>100</b></div></div>
<div id="pad">ходьба</div>
<script>
window.G=[0,0,0,0,0,0,0,0];
(function(){var mp=document.getElementById('map'),mc=document.getElementById('mc'),cx=mc.getContext('2d'),E=440;
function draw(){if(!mp.classList.contains('on'))return;cx.clearRect(0,0,512,512);
if(window.mapCanvas){cx.imageSmoothingEnabled=true;cx.drawImage(window.mapCanvas,0,0,512,512);}else{cx.fillStyle='#fff';cx.font='20px sans-serif';cx.fillText('Загрузка карты…',170,256);}
var P=window.PP;if(P){var x=(P.x+E)/(2*E)*512,y=(P.z+E)/(2*E)*512;cx.save();cx.translate(x,y);cx.rotate(-P.yaw);cx.fillStyle='#ff3b30';cx.strokeStyle='#fff';cx.lineWidth=2;cx.beginPath();cx.moveTo(0,-12);cx.lineTo(8,9);cx.lineTo(0,5);cx.lineTo(-8,9);cx.closePath();cx.fill();cx.stroke();cx.restore();}}
window.mapDraw=draw;
document.getElementById('mapb').addEventListener('pointerdown',function(e){e.preventDefault();G[7]=1;mp.classList.add('on');draw();setTimeout(draw,400);});
mp.addEventListener('pointerdown',function(e){e.preventDefault();mp.classList.remove('on');});
})();
(function(){var AX=window.AudioContext||window.webkitAudioContext;if(!AX)return;var AC=new AX();
var N=['walk_grass','run_grass','walk_sand','run_sand','walk_snow','run_snow','jump_grass','bush','morning','evening'],B={},L={},SF=['grass','sand','snow'];
N.forEach(function(n){var x=new XMLHttpRequest();x.open('GET','s_'+n+'.mp3');x.responseType='arraybuffer';x.onload=function(){AC.decodeAudioData(x.response,function(b){B[n]=b;},function(){});};x.send();});
document.addEventListener('pointerdown',function(){if(AC.state!=='running')AC.resume();},{passive:true});
function vol(n,v){v=Math.round(v*50)/50;if(!B[n]||AC.state!=='running')return;var l=L[n];
if(!l){var g=AC.createGain();g.gain.value=0;g.connect(AC.destination);var s=AC.createBufferSource();s.buffer=B[n];s.loop=true;s.connect(g);s.start(0);l=L[n]={g:g,t:0};}
if(l.t===v)return;l.t=v;l.g.gain.setTargetAtTime(v,AC.currentTime,.1);}
function once(n,v){if(!B[n]||AC.state!=='running')return;var g=AC.createGain();g.gain.value=v;g.connect(AC.destination);var s=AC.createBufferSource();s.buffer=B[n];s.connect(g);s.start(0);}
window.audioState=function(su,sp,bu,td,jm){
var cur=sp?(sp>1?'run_':'walk_')+SF[su]:'';
for(var i=0;i<6;i++)vol(N[i],N[i]===cur?(sp>1?.9:.8):0);
vol('bush',bu&&sp?.7:0);if(jm)once('jump_grass',.8);
var d1=Math.abs(td-.12);d1=Math.min(d1,1-d1);var d2=Math.abs(td-.52);d2=Math.min(d2,1-d2);
vol('morning',Math.max(0,1-d1/.2)*.45);vol('evening',Math.max(0,1-d2/.3)*.45);};
})();
(function(){var hu=document.getElementById('hud');
function bar(id,v){var e=document.getElementById(id);v=Math.max(0,Math.min(100,+v||0));e.children[1].style.transform='scaleX('+v/100+')';e.children[2].textContent=Math.round(v);}
window.hudUpdate=function(s){var a=s.split('|');bar('hp',a[0]);bar('hu',a[1]);bar('th',a[2]);
window.PP={x:+a[7],z:+a[8],yaw:+a[9]/100};if(window.mapDraw)window.mapDraw();hu.innerHTML='<span>🪵 '+a[3]+'</span><span>🪨 '+a[4]+'</span><span>🔩 '+a[5]+'</span><span>🟡 '+a[6]+'</span>'+(a[10]?'<em>'+a[10]+'</em>':'');};})();
(function(){
var t=document.getElementById('touch'),jb=document.getElementById('jb'),jk=document.getElementById('jk'),sid=-1,lid=-1,bx=0,by=0,lx=0,ly=0,R=60;
function sv(e){var dx=e.clientX-bx,dy=e.clientY-by,l=Math.hypot(dx,dy);if(l>R){dx*=R/l;dy*=R/l;}G[3]=dx/R;G[4]=dy/R;jk.style.transform='translate('+dx+'px,'+dy+'px)';}
t.addEventListener('pointerdown',function(e){e.preventDefault();try{t.setPointerCapture(e.pointerId);}catch(x){}
if(e.clientX<innerWidth/2&&sid<0){sid=e.pointerId;bx=e.clientX;by=e.clientY;jb.style.display='block';jb.style.left=(bx-R)+'px';jb.style.top=(by-R)+'px';sv(e);}
else if(lid<0){lid=e.pointerId;lx=e.clientX;ly=e.clientY;}});
t.addEventListener('pointermove',function(e){if(e.pointerId===sid)sv(e);else if(e.pointerId===lid){G[5]+=e.clientX-lx;G[6]+=e.clientY-ly;lx=e.clientX;ly=e.clientY;}});
function up(e){if(e.pointerId===sid){sid=-1;G[3]=0;G[4]=0;jb.style.display='none';}else if(e.pointerId===lid)lid=-1;}
t.addEventListener('pointerup',up);t.addEventListener('pointercancel',up);
})();
(function(){
function on(el,t,f){el.addEventListener(t,function(e){e.preventDefault();f();},{passive:false});}
var hit=document.getElementById('hit'),hl=document.getElementById('hl'),sl=document.querySelectorAll('#bar button[data-s]');
on(hit,'pointerdown',function(){G[0]=1;hit.classList.add('on');});
['pointerup','pointercancel','pointerleave'].forEach(function(t){on(hit,t,function(){G[0]=0;hit.classList.remove('on');});});
on(document.getElementById('jump'),'pointerdown',function(){G[1]=1;});
sl.forEach(function(b){on(b,'pointerdown',function(){G[2]=+b.dataset.s;hl.textContent=G[2]?'Строить':'Удар';sl.forEach(function(x){x.classList.toggle('on',x===b);});});});
})();
var hud=document.getElementById('hud');
function fail(m){hud.style.color='#ffb4a8';hud.style.whiteSpace='pre-wrap';hud.textContent=m;}
window.onerror=function(m){fail('Ошибка: '+m);};
window.onunhandledrejection=function(e){fail('Ошибка: '+(e.reason&&e.reason.message||e.reason));};
var Module={canvas:document.getElementById('canvas'),print:console.log,printErr:console.warn,onAbort:function(w){fail('Сбой: '+w);}};
setTimeout(function(){if(hud.textContent.indexOf('Загрузка')===0)fail('Игра не запустилась за 10 секунд.\nПроверьте Settings → Pages → Source: GitHub Actions и вкладку Actions.');},10000);
</script>
<script src="game.js" onerror="fail('Файл game.js не найден.\nSettings → Pages → Source → GitHub Actions, затем запустите Deploy во вкладке Actions.')"></script>
</body>
</html>
