<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Mini-Rust</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:8px 14px;color:#fff;font:600 16px/1.3 -apple-system,system-ui,sans-serif;text-shadow:0 1px 3px #000;pointer-events:none}
#x{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font:300 26px sans-serif;text-shadow:0 0 3px #000;pointer-events:none}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">Загрузка…</div>
<div id="x">+</div>
<script>
var hud=document.getElementById('hud');
function fail(m){hud.style.color='#ffb4a8';hud.style.whiteSpace='pre-wrap';hud.textContent=m;}
window.onerror=function(m){fail('Ошибка: '+m);};
window.onunhandledrejection=function(e){fail('Ошибка: '+(e.reason&&e.reason.message||e.reason));};
var Module={canvas:document.getElementById('canvas'),print:console.log,printErr:console.warn,onAbort:function(w){fail('Сбой: '+w);}};
setTimeout(function(){if(hud.textContent.indexOf('Загрузка')===0)fail('Игра не запустилась за 10 секунд.\nПроверьте Settings → Pages → Source: GitHub Actions и вкладку Actions.');},10000);
</script>
<script src="game.js" onerror="fail('Файл game.js не найден.\nSettings → Pages → Source → GitHub Actions, затем запустите Deploy во вкладке Actions.')"></script>
</body>
</html>
