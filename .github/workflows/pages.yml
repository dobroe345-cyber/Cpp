name: Deploy to GitHub Pages
# 1. builds main.cpp with the SAME flags as build.sh and the SAME emsdk version it was tested with
# 2. starts the built game in headless Chrome (tools/smoke_test.py); a game that does not load is never published
# 3. AFTER the deployment, keeps game.js / game.wasm in the repository root up to date (so Pages also works with "Deploy from a branch").
#    This must come last: the commit makes GitHub start its own "pages build and deployment" run, and if that starts while
#    our deployment is still running it fails with "due to in progress deployment" (a red cross that means nothing).
# 4. publishes index.html + game.js + game.wasm + icons/models/sounds to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.58
      - name: Compile C++ to WebAssembly (flags are in build.sh)
        run: bash build.sh
      - name: Assemble the site
        run: |
          mkdir dist
          cp index.html game.js game.wasm dist/
          for d in icons models sounds; do
            if [ -d "$d" ]; then cp -r "$d" dist/; fi
          done
          touch dist/.nojekyll
      - name: Smoke test (the game must really start)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet playwright
          .venv/bin/python tools/smoke_test.py dist smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: smoke.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: game-build
          path: |
            dist/game.js
            dist/game.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  refresh-root:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: game-build
          path: built
      - name: Keep game.js / game.wasm in the repository root up to date
        run: |
          cp built/game.js built/game.wasm .
          if [ -n "$(git status --porcelain -- game.js game.wasm)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add game.js game.wasm
            git commit -m "Rebuild game.js and game.wasm from main.cpp [skip ci]"
            git push
          fi
